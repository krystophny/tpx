name: Windows file watcher

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-file-watch:
    name: Native Windows file watcher
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned Lazarus and FPC toolchain
        shell: pwsh
        run: ./ci/bootstrap-windows.ps1
      - name: Build and run native watcher tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $build = Join-Path $env:RUNNER_TEMP 'file-watch-windows'
          New-Item -ItemType Directory -Path $build -Force | Out-Null
          fpc -B -gl -Crtoi -Sa -dFILEWATCH_TESTS "-FU$build" "-FE$build" "-Fu./src" tests/WatchWindowsTests.lpr
          if ($LASTEXITCODE -ne 0) { throw "FPC failed with exit code $LASTEXITCODE" }
          $helper = (Resolve-Path tests/watch_windows_helper.ps1).Path
          & (Join-Path $build 'WatchWindowsTests.exe') $helper
          if ($LASTEXITCODE -ne 0) { throw "Windows watcher tests failed with exit code $LASTEXITCODE" }
