name: Publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Publish this reviewed version from its supported release branch
        required: true
        default: '1.6.1'
        type: string

permissions:
  contents: read

concurrency:
  group: tpx-release
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    outputs:
      prerelease: ${{ steps.policy.outputs.prerelease }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check branch, version, source and release history
        id: policy
        run: |
          python3 ci/release_policy.py preflight "$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
  packages:
    needs: preflight
    uses: ./.github/workflows/candidate.yml
    with:
      version: ${{ inputs.version }}
      package_kind: release
  publish:
    needs: [preflight, packages]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: tpx-*-release-${{ github.sha }}
          path: release-assets
          merge-multiple: true
      - name: Verify archives, source, provenance and checksums
        run: python3 ci/verify_release.py release-assets
      - name: Choose the latest stable release
        id: release_mode
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases" > "$RUNNER_TEMP/tpx-releases.json"
          python3 ci/release_policy.py latest "$RELEASE_VERSION" "$RUNNER_TEMP/tpx-releases.json" >> "$GITHUB_OUTPUT"
      - name: Create exact tag and draft with tested artifacts
        run: |
          tag="v$RELEASE_VERSION"
          if git ls-remote --exit-code origin "refs/tags/$tag" >/dev/null; then
            echo "release tag already exists: $tag" >&2
            exit 1
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA"
          git fetch --no-tags origin "refs/tags/$tag:refs/tags/$tag"
          test "$(git rev-parse "$tag^{commit}")" = "$GITHUB_SHA"
          notes=()
          if [[ "${{ needs.preflight.outputs.prerelease }}" == true ]]; then
            notes+=(--prerelease --latest=false --notes "Pre-release of TpX $RELEASE_VERSION. This build is for evaluation and is not a stable release.")
          else
            notes+=(--latest=${{ steps.release_mode.outputs.latest }})
          fi
          gh release create "$tag" release-assets/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --target "$GITHUB_SHA" \
            --title "TpX $RELEASE_VERSION" --generate-notes --draft "${notes[@]}"
          gh release view "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --json assets > release-assets/uploaded.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          folder = Path('release-assets')
          expected = {p.name for p in folder.iterdir() if p.name != 'uploaded.json'}
          uploaded = {a['name'] for a in json.loads((folder / 'uploaded.json').read_text())['assets']}
          assert uploaded == expected, (uploaded, expected)
          PY
          if [[ "${{ needs.preflight.outputs.prerelease }}" == true ]]; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
          else
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false
          fi
