name: Linux tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gtk2:
    runs-on: ubuntu-24.04
    env:
      WIDGETSET: gtk2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install compiler and GTK2 development tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fpc libgtk2.0-dev xvfb xdotool texlive-latex-extra texlive-pictures ghostscript dvisvgm dvipng librsvg2-bin
      - name: Build the pinned Lazarus toolchain with the upstream opener repair
        run: bash ci/bootstrap-unix.sh
      - name: Build the pinned bitmap converter for real export tests
        run: bash ci/bootstrap-sam2p.sh
      - name: Build and run behavioral tests
        run: xvfb-run -a make test

  trusted-source-render:
    runs-on: ubuntu-24.04
    env:
      WIDGETSET: gtk2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install compiler, renderer and image inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fpc libgtk2.0-dev xvfb texlive-latex-extra texlive-pictures ghostscript dvisvgm dvipng librsvg2-bin poppler-utils
      - name: Build the pinned Lazarus toolchain with the upstream opener repair
        run: bash ci/bootstrap-unix.sh
      - name: Build TpX and run trusted scene render acceptance
        run: xvfb-run -a make test-source-acceptance
