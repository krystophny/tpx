name: Linux tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gtk2:
    runs-on: ubuntu-24.04
    env:
      WIDGETSET: gtk2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install compiler and GTK2 development tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fpc libgtk2.0-dev xvfb texlive-latex-extra texlive-pictures ghostscript
      - name: Build the pinned Lazarus toolchain with the upstream opener repair
        run: bash ci/bootstrap-unix.sh
      - name: Build and run behavioral tests
        run: xvfb-run -a make test
