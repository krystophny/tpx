name: Linux tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  strict-core:
    name: strict display-free core tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Free Pascal
        run: |
          sudo apt-get update
          sudo apt-get install -y fpc
      - name: Run deterministic core, parser, and seeded-fuzz tests
        run: make test-core
      - name: Upload core suite results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: strict-core-${{ github.sha }}
          path: obj/core-tests/core-report.json
          if-no-files-found: warn
          retention-days: 14

  linux-file-watch:
    name: Linux inotify conformance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Free Pascal
        run: |
          sudo apt-get update
          sudo apt-get install -y fpc
      - name: Run native inotify and helper-process cases
        run: python3 tests/test_filewatch_linux.py -v

  gtk2:
    name: Linux real LCL integration
    runs-on: ubuntu-24.04
    env:
      WIDGETSET: gtk2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install compiler and GTK2 development tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fpc libgtk2.0-dev xvfb xdotool texlive-latex-extra texlive-pictures ghostscript dvisvgm dvipng librsvg2-bin
      - name: Build the pinned Lazarus toolchain with the upstream opener repair
        run: bash ci/bootstrap-unix.sh
      - name: Build the pinned bitmap converter for real export tests
        run: bash ci/bootstrap-sam2p.sh
      - name: Build and run behavioral tests
        run: xvfb-run -a make test-gui test-tex

  trusted-source-render:
    runs-on: ubuntu-24.04
    env:
      WIDGETSET: gtk2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install compiler, renderer and image inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fpc libgtk2.0-dev xvfb texlive-latex-extra texlive-pictures ghostscript dvisvgm dvipng librsvg2-bin poppler-utils
      - name: Build the pinned Lazarus toolchain with the upstream opener repair
        run: bash ci/bootstrap-unix.sh
      - name: Build TpX and run trusted scene render acceptance
        run: xvfb-run -a make test-source-acceptance
      - name: Upload machine-readable acceptance results and failure renders
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-acceptance-${{ github.sha }}
          path: obj/source-acceptance/
          if-no-files-found: warn
          retention-days: 14
