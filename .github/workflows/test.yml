name: Linux tests

on:
  push:
  pull_request:

jobs:
  gtk2:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler and GTK2 development tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fpc lazarus lcl-gtk2 libgtk2.0-dev xvfb
      - name: Build and run behavioral tests
        run: xvfb-run -a make test
