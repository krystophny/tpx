name: Browser (WASI) target

# Builds TpX for the browser and runs the headless Chromium behavioral suite.
# The toolchain (FPC wasm32-wasip1 cross compiler, the CustomDrawn/WASM LCL from
# the fork, pas2js) is built once from the pins in web/pins.env and cached; see
# ci/web-toolchain.sh.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: wasm build and Chromium playtest
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      TMPDIR: ${{ github.workspace }}/.tmp
      WASM_LCL: ${{ github.workspace }}/toolchain/lazarus-lcl-wasm
      WASM_FPC: ${{ github.workspace }}/toolchain/fpc-lcl-wasm
      WASM_PAS2JS: ${{ github.workspace }}/toolchain/pas2js
      WASM_BIN: ${{ github.workspace }}/toolchain/bin

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Prepare scratch space
        run: mkdir -p "$TMPDIR" "$WASM_BIN"

      - name: Install build and browser dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fpc make git curl python3-pip libpng-tools nodejs npm
          python3 -m pip install --break-system-packages playwright

      - name: Install browser dependencies and fixed Chromium
        run: |
          mkdir -p "$RUNNER_TEMP/chromium"
          python3 -m playwright install-deps chromium
          # Chromium issue 556160935 is fixed upstream in Chrome 155; the old
          # Playwright-bundled Chromium 153 crashes during repeated downloads.
          # https://issues.chromium.org/issues/556160935
          curl --fail --location --retry 3 \
            https://storage.googleapis.com/chrome-for-testing-public/155.0.8059.39/linux64/chrome-linux64.zip \
            --output "$RUNNER_TEMP/chrome-linux64.zip"
          python3 - "$RUNNER_TEMP/chrome-linux64.zip" "$RUNNER_TEMP/chromium" <<'PY'
          import sys
          from pathlib import Path
          from zipfile import ZipFile

          destination = Path(sys.argv[2])
          with ZipFile(sys.argv[1]) as archive:
              archive.extractall(sys.argv[2])
              for entry in archive.infolist():
                  mode = (entry.external_attr >> 16) & 0o777
                  path = destination / entry.filename
                  if mode and path.exists():
                      path.chmod(mode)
          PY
          chromium="$RUNNER_TEMP/chromium/chrome-linux64/chrome"
          "$chromium" --version
          echo "CHROMIUM=$chromium" >> "$GITHUB_ENV"

      - name: Read toolchain cache pins
        id: pins
        run: |
          . web/pins.env
          echo "fpc-rev=$WASM_FPC_REV" >> "$GITHUB_OUTPUT"

      - name: Restore toolchain cache
        id: tc
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ github.workspace }}/toolchain
          key: web-toolchain-${{ runner.os }}-fpc-${{ steps.pins.outputs.fpc-rev }}-${{ hashFiles('web/pins.env', 'ci/web-toolchain.sh') }}
          restore-keys: |
            web-toolchain-${{ runner.os }}-fpc-${{ steps.pins.outputs.fpc-rev }}-
            web-toolchain-

      - name: Build the pinned WASI toolchain
        env:
          ALLOW_LONG_BUILD: '1'
        run: |
          chmod +x ci/web-toolchain.sh web/build.sh
          ci/web-toolchain.sh build

      - name: Assert the toolchain layout
        run: ci/web-toolchain.sh check

      - name: Build TpX for the browser
        run: make web

      - name: Report payload size
        run: |
          ls -l web/dist
          gzip -9 -c web/dist/tpx.wasm | wc -c | awk '{printf "tpx.wasm gzipped: %.2f MB\n", $1/1048576}'

      - name: Run the headless browser behavioral suite
        run: |
          test -x "$CHROMIUM"
          python3 tests/browser/playtest.py --chromium "$CHROMIUM"

      - name: Keep the built page for the performance gates and Pages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-dist-${{ github.sha }}
          path: web/dist/
          if-no-files-found: error
          retention-days: 7

      - name: Stamp the Pages build
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          . web/pins.env
          rm -rf "$RUNNER_TEMP/pages" && cp -r web/dist "$RUNNER_TEMP/pages"
          stamp="TpX ${GITHUB_SHA::7} · Lazarus ${WASM_LCL_REV::10} · $(date -u +%Y-%m-%d)"
          sed -i "s|<span id=\"build-info\"></span>|<span id=\"build-info\">$stamp</span>|" "$RUNNER_TEMP/pages/index.html"
          grep -q "$stamp" "$RUNNER_TEMP/pages/index.html"

      - name: Upload the Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ${{ runner.temp }}/pages

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-playtest-${{ github.sha }}
          path: |
            dist/browser-playtest/
          if-no-files-found: warn
          retention-days: 14

  perf:
    name: Chromium performance gates
    needs: web
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web-dist-${{ github.sha }}
          path: web/dist

      - name: Install Playwright
        run: python3 -m pip install --break-system-packages playwright

      - name: Install browser dependencies and fixed Chromium
        run: |
          mkdir -p "$RUNNER_TEMP/chromium"
          python3 -m playwright install-deps chromium
          # Chromium issue 556160935 is fixed upstream in Chrome 155; the old
          # Playwright-bundled Chromium 153 crashes during repeated downloads.
          # https://issues.chromium.org/issues/556160935
          curl --fail --location --retry 3 \
            https://storage.googleapis.com/chrome-for-testing-public/155.0.8059.39/linux64/chrome-linux64.zip \
            --output "$RUNNER_TEMP/chrome-linux64.zip"
          python3 - "$RUNNER_TEMP/chrome-linux64.zip" "$RUNNER_TEMP/chromium" <<'PY'
          import sys
          from pathlib import Path
          from zipfile import ZipFile

          destination = Path(sys.argv[2])
          with ZipFile(sys.argv[1]) as archive:
              archive.extractall(sys.argv[2])
              for entry in archive.infolist():
                  mode = (entry.external_attr >> 16) & 0o777
                  path = destination / entry.filename
                  if mode and path.exists():
                      path.chmod(mode)
          PY
          chromium="$RUNNER_TEMP/chromium/chrome-linux64/chrome"
          "$chromium" --version
          echo "CHROMIUM=$chromium" >> "$GITHUB_ENV"

      - name: Performance gates
        run: python3 tests/browser/perf.py

  pages:
    name: Deploy the browser build to GitHub Pages
    # The build and the behavioral suite gate the deployment; the
    # runner-dependent performance gates are reported by their own job.
    needs: web
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
