name: macOS file-watch tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native-kqueue:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Free Pascal
        run: brew install fpc
      - name: Build and run the headless native file-watch tests
        run: python3 tests/test_filewatch_macos.py
