<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>TpX in the browser</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:#1c2635;font:15px system-ui,sans-serif}main{margin:16px auto;padding:0 16px;max-width:1100px}h1{font-size:22px;margin:4px 0}#status{font-size:14px;color:#345477}#status[data-state=error]{color:#a62121}#document-status{margin:6px 0 10px;padding:6px 9px;background:#eef6ff;border-left:3px solid #79a9da;color:#193b5c;font-size:13px}#document-status[data-state=unsaved]{background:#fff8e1;border-color:#d9a406;color:#4a3608}#document-status[data-state=error]{background:#fff0f0;border-color:#c44;color:#731b1b}
canvas{display:block;border:1px solid #bcc7d4;background:white;touch-action:none}
#notice,#source-snapshot-status{position:fixed;left:50%;transform:translateX(-50%);max-width:min(680px,92vw);display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:6px;box-shadow:0 2px 10px rgba(20,30,45,.18);font-size:14px;z-index:40}#notice{bottom:82px;background:#fff8e1;border:1px solid #d9a406;border-left:4px solid #d9a406;color:#4a3608}#source-snapshot-status{bottom:18px;background:#eef6ff;border:1px solid #79a9da;border-left:4px solid #3478b8;color:#193b5c}#notice[hidden],#source-snapshot-status[hidden]{display:none}#notice button,#source-snapshot-status button{border:1px solid #b58900;background:#fff;border-radius:4px;color:#6b4d00;padding:3px 12px;cursor:pointer}
#tpx-copy-fallback{position:fixed;left:50%;transform:translateX(-50%);bottom:132px;max-height:min(360px,70vh);overflow:auto;width:min(680px,92vw);padding:12px;background:white;border:1px solid #7890ad;border-left:4px solid #42678f;border-radius:6px;box-shadow:0 2px 10px rgba(20,30,45,.2);z-index:50}#tpx-copy-fallback[hidden]{display:none}#tpx-copy-fallback p{margin:0 0 8px}#tpx-copy-fallback textarea{display:block;width:100%;height:min(180px,40vh);margin:0 0 8px;font:13px ui-monospace,monospace;white-space:pre;user-select:text}#tpx-copy-fallback button{margin-right:8px;padding:4px 10px}
#lcl-surface{position:relative;max-width:100%}canvas{max-width:100%;height:auto}#lcl-dom{position:absolute;inset:0;pointer-events:none}#lcl-dom>*{pointer-events:auto;font-family:system-ui}#lcl-dom button{border:1px solid #a5b8ce;background:#fff;border-radius:4px;color:#203e69;cursor:pointer}#lcl-dom label{display:flex;align-items:center;gap:8px}.scroller{overflow:auto}
</style>
</head>
<body><main>
<h1>TpX</h1><p id="status" data-state="loading" role="status">Loading TpX…</p>
<p>Start with a <a href="./examples/quadratic-function.TpX" download="quadratic-function.TpX">Quadratic function</a>,
<a href="./examples/vector-addition.TpX" download="vector-addition.TpX">Vector addition</a>, or
<a href="./examples/double-slit.TpX" download="double-slit.TpX">Double-slit diagram</a>.
Then choose <strong>File → Open</strong> and select the downloaded <code>.TpX</code> file.
<p id="document-status" data-state="clean" role="status" aria-live="polite">This browser drawing is not saved to the original file. Download a copy to keep it outside this browser.</p>
<div class="scroller"><div id="lcl-surface"><canvas id="lcl" width="720" height="480" tabindex="0" aria-label="TpX drawing application"></canvas><div id="lcl-dom"></div></div></div>
</main><script src="./jobhost.js"></script><script>rtl.run();</script><script type="module" src="./host.bundle.js"></script></body>
</html>
